<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>El Ancla | Catálogo Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --primary: #0f172a;
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --radius: 16px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      padding-bottom: 90px;
    }

    .container {
      max-width: 100%;
      margin: 0 auto;
      padding: 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand-title {
      font-family: 'Oswald', sans-serif;
      font-size: 24px;
      color: var(--primary);
      margin: 0;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .web-nav {
      display: none;
      gap: 10px;
    }
    .web-nav-btn {
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }
    .web-nav-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    .card-header {
      font-family: 'Oswald', sans-serif;
      font-size: 18px;
      color: var(--primary);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .grid-layout {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    input[type="text"], input[type="number"], input[type="file"] {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--primary);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }
    .btn-accent { background: var(--accent); }
    .btn-danger { background: #fef2f2; color: var(--danger); }
    .btn-sm { width: auto; padding: 8px 14px; font-size: 13px; }

    .product-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .product-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .product-left { display: flex; align-items: center; gap: 12px; }
    .product-img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: #cbd5e1; }
    .product-name { font-weight: 600; font-size: 15px; }
    .product-notes { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .product-price { font-size: 14px; font-weight: 700; color: var(--accent); }

    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 100;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      border: none;
      background: none;
      width: 33.33%;
    }
    .nav-item.active { color: var(--accent); }

    .tab-content { display: none !important; }
    .tab-content.active { display: block !important; }

    .page-a4 {
      position: relative;
      width: 210mm;
      height: 297mm;
      margin: 0 auto;
      background: #ffffff;
      padding: 18mm 15mm;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      border-radius: 4px;
      box-sizing: border-box;
    }

    @media (min-width: 800px) {
      body { padding-bottom: 30px; }
      .container { max-width: 1280px; padding: 24px; }
      .web-nav { display: flex !important; }
      .nav-bar { display: none !important; }

      .grid-layout {
        display: grid !important;
        grid-template-columns: 380px 1fr !important;
        gap: 24px !important;
      }

      .product-grid {
        display: grid !important;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)) !important;
        gap: 14px !important;
      }
    }

    @media print {
      @page { size: A4 portrait; margin: 0; }
      html, body { width: 210mm; height: 297mm; background: white; margin: 0 !important; padding: 0 !important; }
      .no-print { display: none !important; }
      #vistaDocumento { display: block !important; margin: 0 !important; padding: 0 !important; }
      .page-a4 { box-shadow: none !important; border-radius: 0 !important; padding: 15mm !important; }
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <div class="top-bar no-print">
    <div class="brand-title">EL ANCLA</div>

    <div class="web-nav">
      <button class="web-nav-btn active" onclick="switchTab('tabCatalogo')">📦 Productos</button>
      <button class="web-nav-btn" onclick="switchTab('tabCrear')">📝 Crear Lista</button>
      <button class="web-nav-btn" onclick="switchTab('tabHistorial')">📜 Histórico</button>
    </div>

    <div>
      <button onclick="toggleConfig()" class="btn btn-sm" style="background: var(--accent-light); color: var(--accent);">⚙️ Ajustes</button>
    </div>
  </div>

  <div class="container no-print">

    <!-- CONFIGURACIÓN -->
    <div id="tabConfig" class="card" style="display: none;">
      <div class="card-header">⚙️ Ajustes del Encabezado</div>
      <div class="field">
        <label>Empresa</label>
        <input type="text" id="empresaNombre" value="EL ANCLA">
      </div>
      <div class="field">
        <label>Comercial</label>
        <input type="text" id="comercialNombre" placeholder="Ej: Juan Pérez">
      </div>
      <div class="field">
        <label>Teléfono Comercial</label>
        <input type="text" id="comercialTelefono" placeholder="Ej: +34 600 000 000">
      </div>
      <button onclick="toggleConfig()" class="btn btn-accent" style="margin-top: 12px;">Cerrar Ajustes</button>
    </div>

    <!-- PESTAÑA 1: CATÁLOGO -->
    <div id="tabCatalogo" class="tab-content active">
      <div class="grid-layout">
        <div class="card">
          <div class="card-header">➕ Registrar Producto</div>
          <div class="field">
            <label>Nombre</label>
            <input type="text" id="prodNombre" placeholder="Ej: Merluza Filete">
          </div>
          <div class="field">
            <label>Precio (€)</label>
            <input type="number" step="0.01" id="prodPrecio" placeholder="6.50">
          </div>
          <div class="field">
            <label>Observaciones / Nota (Opcional)</label>
            <input type="text" id="prodNotas" placeholder="Ej: Caja de 5kg">
          </div>
          <button id="btnGuardarProd" onclick="guardarProducto()" class="btn">Guardar Producto</button>
        </div>

        <div class="card">
          <div class="card-header">📦 Productos Registrados</div>
          <div id="listaProductosCard" class="product-grid">Cargando datos...</div>
        </div>
      </div>
    </div>

    <!-- PESTAÑA 2: CREAR LISTA DE PRECIOS -->
    <div id="tabCrear" class="tab-content">
      <div class="card">
        <div class="card-header">🚀 Nueva Lista de Precios</div>
        <div class="field">
          <label>Nombre del Cliente</label>
          <input type="text" id="clienteNombre" placeholder="Ej: Restaurante El Faro">
        </div>

        <div style="font-size: 13px; font-weight: 600; color: var(--muted); margin: 16px 0 8px 0;">SELECCIONA LOS PRODUCTOS:</div>
        <div id="listaSeleccionProductos" class="product-grid">Cargando productos...</div>

        <button onclick="generarLista()" class="btn btn-accent" style="margin-top: 20px;">💾 Generar Lista de Precios</button>
      </div>
    </div>

    <!-- PESTAÑA 3: HISTORIAL -->
    <div id="tabHistorial" class="tab-content">
      <div class="card">
        <div class="card-header">📜 Listas Guardadas</div>
        <div id="listaHistoricoCard" class="product-grid">Cargando historial...</div>
      </div>
    </div>

  </div>

  <!-- NAVEGACIÓN INFERIOR MÓVIL -->
  <div class="nav-bar no-print">
    <button class="nav-item active" onclick="switchTab('tabCatalogo')">
      <span>📦 Productos</span>
    </button>
    <button class="nav-item" onclick="switchTab('tabCrear')">
      <span>📝 Crear Lista</span>
    </button>
    <button
