<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>El Ancla | Catálogo & Precios</title>
  <!-- FUENTES DE DISEÑO -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-app: #f8fafc;
      --card-bg: #ffffff;
      --primary: #0f172a;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --border: #f1f5f9;
      --text-main: #334155;
      --text-muted: #64748b;
      --danger: #ef4444;
      --radius: 16px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    /* HEADER APP */
    .app-header {
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .app-title {
      font-family: 'Oswald', sans-serif;
      font-size: 24px;
      color: var(--primary);
      margin: 0;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* TARJETAS MINIMALISTAS */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid rgba(226, 232, 240, 0.8);
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03);
    }
    .card-title {
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      color: var(--primary);
      margin: 0 0 16px 0;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* INPUTS & FORMULARIOS UI/UX */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    .field label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="text"], input[type="number"], input[type="file"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      color: var(--primary);
      transition: all 0.2s ease;
    }
    input[type="text"]:focus, input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    /* BOTONES ESTILO APP */
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: white;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-accent { background: var(--accent); }
    .btn-danger { background: #fef2f2; color: var(--danger); }
    .btn-danger:hover { background: #fee2e2; }
    .btn-icon { width: auto; padding: 8px 12px; font-size: 13px; }

    /* CHECKBOX MINIMALISTA */
    .switch-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-main);
      cursor: pointer;
      margin: 12px 0;
      user-select: none;
    }
    .switch-label input { accent-color: var(--accent); width: 18px; height: 18px; }

    /* TARJETAS DE PRODUCTOS / LISTA MÓVIL */
    .product-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }
    .item-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid #f1f5f9;
    }
    .item-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .item-thumb {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      object-fit: cover;
      background: #e2e8f0;
    }
    .item-title {
      font-weight: 600;
      font-size: 14px;
      color: var(--primary);
      margin: 0;
    }
    .item-sub {
      font-size: 13px;
      color: var(--accent);
      font-weight: 600;
      margin-top: 2px;
    }

    /* VISTA DOCUMENTO IMPRIMIBLE / PDF */
    .watermark-container { position: relative; overflow: hidden; }
    .watermark-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50%;
      opacity: 0.08;
      pointer-events: none;
      z-index: 1;
    }

    @media print {
      body { background: white; margin: 0; padding: 0; }
      .card { border: none; box-shadow: none; padding: 0; }
      .no-print { display: none !important; }
      table { width: 100%; border-collapse: collapse; }
      th, td { border-bottom: 1px solid #e2e8f0; padding: 10px; }
      th { background-color: #f8fafc !important; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>

  <div class="no-print">
    <div class="app-header">
      <h1 class="app-title">📋 Catálogo & Precios</h1>
    </div>

    <!-- 1. ENCABEZADO FIJO -->
    <div class="card">
      <div class="card-title">🏢 Configuración Empresa</div>
      <div class="form-grid">
        <div class="field">
          <label>Nombre Empresa</label>
          <input type="text" id="empresaNombre" placeholder="Ej: El Ancla">
        </div>
        <div class="field">
          <label>Logo / Imagen</label>
          <input type="file" id="empresaLogoFile" accept="image/*" onchange="subirLogoProcesado()">
          <input type="hidden" id="empresaLogoUrl">
          <img id="logoPreviewImg" style="max-height: 40px; margin-top: 8px; border-radius: 6px; display: none;" alt="Preview">
          <button id="btnEliminarLogo" onclick="eliminarLogo()" class="btn btn-danger btn-icon" style="display: none; margin-top: 8px;">🗑️ Quitar Logo</button>
        </div>
        <div class="field">
          <label>Comercial</label>
          <input type="text" id="comercialNombre" placeholder="Ej: Juan Pérez">
        </div>
        <div class="field">
          <label>Teléfono</label>
          <input type="text" id="comercialTelefono" placeholder="Ej: +34 600 000 000">
        </div>
      </div>
      
      <label class="switch-label">
        <input type="checkbox" id="usarMarcaAgua" checked>
        <span>Usar logo como marca de agua al imprimir</span>
      </label>

      <button onclick="guardarEncabezadoNube()" class="btn btn-accent">💾 Guardar Ajustes</button>
    </div>

    <!-- 2. AÑADIR PRODUCTO -->
    <div class="card">
      <div class="card-title">➕ Nuevo Producto</div>
      <div class="form-grid">
        <div class="field">
          <label>Nombre</label>
          <input type="text" id="prodNombre" placeholder="Ej: Menú Pollo Guisado">
        </div>
        <div class="field">
          <label>Precio (€)</label>
          <input type="number" step="0.01" id="prodPrecio" placeholder="6.50">
        </div>
        <div class="field">
          <label>Foto Producto</label>
          <input type="file" id="prodFoto" accept="image/*">
        </div>
      </div>
      <button onclick="guardarProducto()" class="btn">Guardar Producto</button>
    </div>

    <!-- 3. CATÁLOGO -->
    <div class="card">
      <div class="card-title">📦 Catálogo de Productos</div>
      <div class="field">
        <label>Nombre del Cliente</label>
        <input type="text" id="clienteNombre" placeholder="Ej: Restaurante El Faro">
      </div>

      <div id="listaProductosCard" class="product-list">
        <!-- Renderizado dinámico estilizado para móvil -->
      </div>

      <button onclick="generarLista()" class="btn btn-accent" style="margin-top: 16px;">🚀 Guardar Lista de Precios</button>
    </div>

    <!-- 4. HISTÓRICO -->
    <div class="card">
      <div class="card-title">📜 Histórico de Listas</div>
      <div id="listaHistoricoCard" class="product-list">
        <!-- Renderizado dinámico estilizado -->
      </div>
    </div>
  </div>

  <!-- VISTA DOCUMENTO IMPRIMIBLE / PDF -->
  <div id="vistaDocumento" style="display:none;" class="card watermark-container">
    <button onclick="cerrarVistaDocumento()" class="no-print btn" style="background:#64748b; margin-bottom:12px;">⬅️ Volver</button>
    <button onclick="window.print()" class="no-print btn btn-accent" style="margin-bottom:16px;">📥 Descargar / Imprimir PDF</button>

    <div id="contenidoImprimible" style="position: relative; z-index: 2;"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://irjwegtxvoxhbnfvhnvv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlyandlZ3R4dm94aGJuZnZobnZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMDM0NTgsImV4cCI6MjEwNjc3OTQ1OH0.Eb5A-HaTLLzFV_unn9b-QjCQLVT41x8rxMBOCINLpMg'; 
    
    let _supabase = null;
    let _productosCache = [];

    window.onload = function() {
      try {
        _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        cargarEncabezadoNube();
        cargarProductos();
        cargarHistoricoListas();
      } catch (e) {
        console.error("Error cargando Supabase:", e);
      }
    };

    async function eliminarLogo() {
      document.getElementById('empresaLogoUrl').value = '';
      document.getElementById('empresaLogoFile').value = '';
      document.getElementById('logoPreviewImg').style.display = 'none';
      document.getElementById('btnEliminarLogo').style.display = 'none';
      await guardarEncabezadoNube();
    }

    async function guardarEncabezadoNube() {
      if (!_supabase) return;
      const empresa = document.getElementById('empresaNombre').value;
      const comercial = document.getElementById('comercialNombre').value;
      const telefono = document.getElementById('comercialTelefono').value;
      const logoUrl = document.getElementById('empresaLogoUrl').value;

      const { error } = await _supabase.from('configuracion').upsert([
        { id: 'fija', empresa, comercial, telefono, logo_url: logoUrl }
      ]);

      if (error) alert('Error: ' + error.message);
      else alert('¡Configuración guardada!');
    }

    async function cargarEncabezadoNube() {
      if (!_supabase) return;
      try {
        const { data } = await _supabase.from('configuracion').select('*').eq('id', 'fija').maybeSingle();
        if (data) {
          document.getElementById('empresaNombre').value = data.empresa || '';
          document.getElementById('comercialNombre').value = data.comercial || '';
          document.getElementById('comercialTelefono').value = data.telefono || '';
          document.getElementById('empresaLogoUrl').value = data.logo_url || '';

          if (data.logo_url) {
            const preview = document.getElementById('logoPreviewImg');
            preview.src = data.logo_url;
            preview.style.display = 'block';
            document.getElementById('btnEliminarLogo').style.display = 'inline-block';
          }
        }
      } catch(e) {}
    }

    async function subirLogoProcesado() {
      const archivoLogo = document.getElementById('empresaLogoFile').files[0];
      if (!archivoLogo || !_supabase) return;

      const nombreArchivo = 'logo_' + Date.now() + '_' + archivoLogo.name.replace(/\s+/g, '_');
      const { error: uploadError } = await _supabase.storage.from('productos-fotos').upload(nombreArchivo, archivoLogo);

      if (uploadError) {
        alert('Error al subir logo: ' + uploadError.message);
        return;
      }

      const { data: publicUrlData } = _supabase.storage.from('productos-fotos').getPublicUrl(nombreArchivo);
      const urlFinal = publicUrlData.publicUrl;
      document.getElementById('empresaLogoUrl').value = urlFinal;
      
      const preview = document.getElementById('logoPreviewImg');
      preview.src = urlFinal;
      preview.style.display = 'block';
      document.getElementById('btnEliminarLogo').style.display = 'inline-block';

      guardarEncabezadoNube();
    }

    async function cargarProductos() {
      const container = document.getElementById('listaProductosCard');
      if (!_supabase) return;

      try {
        const { data, error } = await _supabase.from('productos').select('*').order('id', { ascending: true });
        
        if (error || !data || data.length === 0) {
          _productosCache = [];
          container.innerHTML = '<div style="font-size:13px; color:var(--text-muted); text-align:center; padding:12px;">Sin productos registrados.</div>';
          return;
        }

        _productosCache = data;

        container.innerHTML = _productosCache.map(function(prod) {
          var img = prod.url_foto ? '<img src="' + prod.url_foto + '" class="item-thumb" crossorigin="anonymous">' : '<div class="item-thumb"></div>';
          return `
            <div class="item-card">
              <div class="item-info">
                <input type="checkbox" class="prod-checkbox" value="${prod.id}" style="width: 18px; height: 18px; accent-color: var(--accent);">
                ${img}
                <div>
                  <div class="item-title">${prod.nombre}</div>
                  <div class="item-sub">${parseFloat(prod.precio).toFixed(2)} €</div>
                </div>
              </div>
              <button class="btn btn-danger btn-icon" onclick="borrarProducto(${prod.id}, '${prod.nombre.replace(/'/g, "\\'")}')">🗑️</button>
            </div>
          `;
        }).join('');
      } catch(e) {}
    }

    async function borrarProducto(id, nombre) {
      if (!confirm('¿Eliminar "' + nombre + '"?')) return;
      await _supabase.from('productos').delete().eq('id', id);
      cargarProductos();
    }

    async function guardarProducto() {
      const nombre = document.getElementById('prodNombre').value;
      const precio = parseFloat(document.getElementById('prodPrecio').value);
      const archivoFoto = document.getElementById('prodFoto').files[0];

      if (!nombre || isNaN(precio)) {
        alert('Rellena nombre y precio.');
        return;
      }

      let urlFoto = '';
      if (archivoFoto) {
        const nombreArchivo = Date.now() + '_' + archivoFoto.name.replace(/\s+/g, '_');
        await _supabase.storage.from('productos-fotos').upload(nombreArchivo, archivoFoto);
        urlFoto = _supabase.storage.from('productos-fotos').getPublicUrl(nombreArchivo).data.publicUrl;
      }

      await _supabase.from('productos').insert([{ nombre, precio, url_foto: urlFoto }]);
      document.getElementById('prodNombre').value = '';
      document.getElementById('prodPrecio').value = '';
      document.getElementById('prodFoto').value = '';
      cargarProductos();
    }

    async function generarLista() {
      const cliente = document.getElementById('clienteNombre').value;
      if (!cliente) {
        alert('Escribe el cliente.');
        return;
      }

      const cbs = document.querySelectorAll('.prod-checkbox:checked');
      const seleccionados = Array.from(cbs).map(cb => parseInt(cb.value));

      if (seleccionados.length === 0) {
        alert('Selecciona productos.');
        return;
      }

      await _supabase.from('listas_generadas').insert([{ cliente_nombre: cliente, productos_ids: seleccionados }]);
      document.getElementById('clienteNombre').value = '';
      cargarHistoricoListas();
    }

    async function cargarHistoricoListas() {
      const container = document.getElementById('listaHistoricoCard');
      if (!_supabase) return;

      try {
        const { data } = await _supabase.from('listas_generadas').select('*').order('id', { ascending: false });

        if (!data || data.length === 0) {
          container.innerHTML = '<div style="font-size:13px; color:var(--text-muted); text-align:center; padding:12px;">Sin historial.</div>';
          return;
        }

        container.innerHTML = data.map(function(lista) {
          var fecha = new Date(lista.fecha).toLocaleDateString('es-ES');
          return `
            <div class="item-card">
              <div>
                <div class="item-title">${lista.cliente_nombre}</div>
                <div style="font-size: 12px; color: var(--text-muted);">${fecha}</div>
              </div>
              <div style="display:flex; gap:6px;">
                <button class="btn btn-accent btn-icon" onclick="verListaDocumento(${lista.id})">👁️ Ver</button>
                <button class="btn btn-danger btn-icon" onclick="borrarLista(${lista.id}, '${lista.cliente_nombre.replace(/'/g, "\\'")}')">🗑️</button>
              </div>
            </div>
          `;
        }).join('');
      } catch(e) {}
    }

    async function verListaDocumento(id) {
      const { data: lista } = await _supabase.from('listas_generadas').select('*').eq('id', id).single();
      if (!lista) return;

      const empresa = document.getElementById('empresaNombre').value || 'EL ANCLA';
      const comercial = document.getElementById('comercialNombre').value || '';
      const telefono = document.getElementById('comercialTelefono').value || '';
      const logoUrl = document.getElementById('empresaLogoUrl').value;
      const usarMarcaAgua = document.getElementById('usarMarcaAgua').checked;

      const idsGuardados = lista.productos_ids || [];
      const productosSeleccionados = _productosCache.filter(p => idsGuardados.includes(p.id));
      const mostrarLogoLateral = logoUrl && !usarMarcaAgua;

      let htmlDoc = `
        ${(logoUrl && usarMarcaAgua) ? `<img src="${logoUrl}" crossorigin="anonymous" class="watermark-bg">` : ''}

        <div style="border-bottom: 2px solid #1a365d; padding-bottom: 16px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2;">
          <div style="width: 20%; text-align: left;">
            ${mostrarLogoLateral ? `<img src="${logoUrl}" crossorigin="anonymous" style="max-height: 80px; max-width: 100%; object-fit: contain;">` : ''}
          </div>

          <div style="width: 55%; text-align: center;">
            <h1 style="margin: 0; font-family: 'Oswald', sans-serif; font-size: 32px; color: #1a365d; letter-spacing: 1px; text-transform: uppercase;">${empresa}</h1>
            ${comercial ? `
              <p style="margin: 6px 0 0 0; font-family: 'Oswald', sans-serif; font-size: 16px; color: #2563eb; font-weight: 600;">
                COMERCIAL: ${comercial.toUpperCase()}${telefono ? `<span style="margin-left: 6px; color: #1a365d;">| 📞 ${telefono}</span>` : ''}
              </p>
            ` : ''}
          </div>

          <div style="width: 25%; text-align: right; font-size: 13px; color: #334155;">
            <p style="margin: 0; font-family: 'Oswald', sans-serif; font-size: 15px; color: #2563eb; font-weight: 400;">
              CLIENTE: ${lista.cliente_nombre.toUpperCase()}
            </p>
            <p style="margin: 4px 0 0 0; color: #64748b;"><strong>Fecha:</strong> ${new Date(lista.fecha).toLocaleDateString('es-ES')}</p>
          </div>
        </div>

        <table style="width: 100%; border-collapse: collapse; position: relative; z-index: 2;">
          <thead>
            <tr style="background-color: #f8fafc;">
              <th style="width: 70px; text-align: center; color: #1a365d; border-bottom: 2px solid #2563eb; font-family: 'Oswald', sans-serif; font-size: 14px;">FOTO</th>
              <th style="text-align: left; color: #1a365d; border-bottom: 2px solid #2563eb; font-family: 'Oswald', sans-serif; font-size: 14px;">PRODUCTO</th>
              <th style="width: 100px; text-align: right; color: #1a365d; border-bottom: 2px solid #2563eb; font-family: 'Oswald', sans-serif; font-size: 14px;">PRECIO</th>
            </tr>
          </thead>
          <tbody>
            ${productosSeleccionados.map(p => `
              <tr>
                <td style="text-align: center; padding: 8px;">${p.url_foto ? `<img src="${p.url_foto}" crossorigin="anonymous" style="width: 44px; height: 44px; object-fit: cover; border-radius: 6px;">` : '-'}</td>
                <td style="padding: 8px; font-size: 14px; color: #334155;"><strong>${p.nombre}</strong></td>
                <td style="text-align: right; padding: 8px; font-size: 15px; color: #1a365d;"><strong>${parseFloat(p.precio).toFixed(2)} €</strong></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

      document.getElementById('contenidoImprimible').innerHTML = htmlDoc;
      document.querySelector('.no-print').style.display = 'none';
      document.getElementById('vistaDocumento').style.display = 'block';
    }

    function cerrarVistaDocumento() {
      document.getElementById('vistaDocumento').style.display = 'none';
      document.querySelector('.no-print').style.display = 'block';
    }

    async function borrarLista(id, cliente) {
      if (!confirm('¿Borrar lista de "' + cliente + '"?')) return;
      await _supabase.from('listas_generadas').delete().eq('id', id);
      cargarHistoricoListas();
    }
  </script>
</body>
</html>
