 <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>El Ancla | Catálogo Pro v2.6</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --primary: #0d233a;
      --accent: #0056b3;
      --text: #1e293b;
      --muted: #64748b;
      --border: #cbd5e1;
      --danger: #ef4444;
      --radius: 16px;
      --font-main: 'Myriad Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: var(--font-main);
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      padding-bottom: 90px;
    }

    .container { max-width: 100%; margin: 0 auto; padding: 16px; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand-title {
      font-family: 'Oswald', var(--font-main);
      font-size: 24px;
      color: var(--primary);
      margin: 0;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .web-nav { display: flex; gap: 8px; }
    .web-nav-btn {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      font-family: var(--font-main);
    }
    .web-nav-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    .card-header {
      font-family: 'Oswald', var(--font-main);
      font-size: 18px;
      color: var(--primary);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .grid-layout { display: flex; flex-direction: column; gap: 16px; }

    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    input[type="text"], input[type="number"], input[type="file"] {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--primary);
      font-family: var(--font-main);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      font-family: var(--font-main);
    }
    .btn-accent { background: var(--accent); }
    .btn-danger { background: #fef2f2; color: var(--danger); }
    .btn-sm { width: auto; padding: 8px 14px; font-size: 13px; }

    .product-grid { display: flex; flex-direction: column; gap: 10px; }

    .product-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .product-left { display: flex; align-items: center; gap: 12px; }
    .product-img { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; background: #e2e8f0; }
    .product-name { font-weight: 600; font-size: 15px; }
    .product-notes { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .product-price { font-size: 14px; font-weight: 700; color: var(--accent); }

    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 100;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      border: none;
      background: none;
      width: 25%;
      font-family: var(--font-main);
    }
    .nav-item.active { color: var(--accent); }

    .tab-content { display: none !important; }
    .tab-content.active { display: block !important; }

    /* ESTILOS DOCUMENTO A4 */
    .page-a4 {
      position: relative;
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      background: #ffffff;
      padding: 18mm 15mm;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      border-radius: 4px;
      box-sizing: border-box;
      overflow: hidden;
      font-family: var(--font-main);
    }

    .watermark-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60%;
      opacity: 0.08;
      pointer-events: none;
      z-index: 0;
    }

    .doc-content {
      position: relative;
      z-index: 1;
    }

    @media (min-width: 800px) {
      body { padding-bottom: 30px; }
      .container { max-width: 1280px; padding: 24px; }
      .nav-bar { display: none !important; }

      .grid-layout {
        display: grid !important;
        grid-template-columns: 380px 1fr !important;
        gap: 24px !important;
      }

      .product-grid {
        display: grid !important;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)) !important;
        gap: 14px !important;
      }
    }

    @media print {
      @page { size: A4 portrait; margin: 0; }
      html, body { width: 210mm; height: 297mm; background: white; margin: 0 !important; padding: 0 !important; }
      .no-print { display: none !important; }
      #vistaDocumento { display: block !important; margin: 0 !important; padding: 0 !important; }
      .page-a4 { box-shadow: none !important; border-radius: 0 !important; padding: 15mm !important; }
    }
  </style>
</head>
<body>

  <div class="top-bar no-print">
    <div class="brand-title">EL ANCLA</div>
    <div class="web-nav">
      <button class="web-nav-btn active" onclick="switchTab('tabCatalogo')">📦 Productos</button>
      <button class="web-nav-btn" onclick="switchTab('tabCrear')">📝 Crear Lista</button>
      <button class="web-nav-btn" onclick="switchTab('tabHistorial')">📜 Histórico</button>
      <button class="web-nav-btn" onclick="switchTab('tabAjustes')">⚙️ Empresa</button>
    </div>
  </div>

  <div class="container no-print">
    <!-- PESTAÑA CATALOGO -->
    <div id="tabCatalogo" class="tab-content active">
      <div class="grid-layout">
        <div class="card">
          <div class="card-header">➕ Registrar Producto</div>
          <div class="field">
            <label>Nombre del Producto</label>
            <input type="text" id="prodNombre" placeholder="Ej: Merluza Filete">
          </div>
          <div class="field">
            <label>Precio Base (€)</label>
            <input type="number" step="0.01" id="prodPrecio" placeholder="6.50">
          </div>
          <div class="field">
            <label>Observaciones / Nota (Opcional)</label>
            <input type="text" id="prodNotas" placeholder="Ej: Caja de 5kg">
          </div>
          <div class="field">
            <label>Seleccionar Foto (Imagen)</label>
            <input type="file" id="prodArchivoFoto" accept="image/*" onchange="procesarImagen(this, 'prodFotoBase64')">
            <input type="hidden" id="prodFotoBase64">
          </div>
          <button id="btnGuardarProd" onclick="guardarProducto()" class="btn">Guardar Producto</button>
        </div>

        <div class="card">
          <div class="card-header">📦 Productos Registrados</div>
          <div id="listaProductosCard" class="product-grid">Cargando datos...</div>
        </div>
      </div>
    </div>

    <!-- PESTAÑA CREAR LISTA -->
    <div id="tabCrear" class="tab-content">
      <div class="card">
        <div class="card-header">🚀 Nueva Lista de Precios</div>
        <div class="field">
          <label>Nombre del Cliente</label>
          <input type="text" id="clienteNombre" placeholder="Ej: Restaurante El Faro">
        </div>
        <div style="font-size: 13px; font-weight: 600; color: var(--muted); margin: 16px 0 8px 0;">SELECCIONA LOS PRODUCTOS Y AJUSTA EL PRECIO SI ES NECESARIO:</div>
        <div id="listaSeleccionProductos" class="product-grid">Buscando productos...</div>
        <button onclick="generarLista()" class="btn btn-accent" style="margin-top: 20px;">💾 Generar Lista de Precios</button>
      </div>
    </div>

    <!-- PESTAÑA HISTORIAL -->
    <div id="tabHistorial" class="tab-content">
      <div class="card">
        <div class="card-header">📜 Listas Guardadas</div>
        <div id="listaHistoricoCard" class="product-grid">Cargando historial...</div>
      </div>
    </div>

    <!-- PESTAÑA DATOS EMPRESA -->
    <div id="tabAjustes" class="tab-content">
      <div class="card">
        <div class="card-header">⚙️ Configuración de Empresa</div>
        <div class="field">
          <label>Nombre de la Empresa</label>
          <input type="text" id="cfgEmpresa" placeholder="Ej: EL ANCLA">
        </div>
        <div class="field">
          <label>Nombre del Comercial / Agente</label>
          <input type="text" id="cfgComercial" placeholder="Ej: KIKE">
        </div>
        <div class="field">
          <label>Teléfono / WhatsApp</label>
          <input type="text" id="cfgTelefono" placeholder="Ej: 660875927">
        </div>
        <div class="field">
          <label>Logo de la Empresa (Imagen)</label>
          <input type="file" id="cfgLogoFile" accept="image/*" onchange="procesarImagen(this, 'cfgLogoBase64')">
          <input type="hidden" id="cfgLogoBase64">
          <div id="previewLogoContainer" style="margin-top:10px;"></div>
        </div>
        <div class="field" style="display:flex; align-items:center; gap:10px; margin-top:16px;">
          <input type="checkbox" id="cfgMarcaAgua" style="width:20px; height:20px;">
          <label for="cfgMarcaAgua" style="margin:0; text-transform:none; font-size:14px; cursor:pointer;">
            Usar logo como <strong>Marca de Agua centrada</strong>.
          </label>
        </div>
        <button id="btnGuardarCfg" onclick="guardarConfiguracionSupabase()" class="btn btn-accent" style="margin-top:16px;">💾 Guardar Ajustes en Supabase</button>
      </div>
    </div>
  </div>

  <div class="nav-bar no-print">
    <button class="nav-item active" onclick="switchTab('tabCatalogo')"><span>📦 Productos</span></button>
    <button class="nav-item" onclick="switchTab('tabCrear')"><span>📝 Crear</span></button>
    <button class="nav-item" onclick="switchTab('tabHistorial')"><span>📜 Histórico</span></button>
    <button class="nav-item" onclick="switchTab('tabAjustes')"><span>⚙️ Empresa</span></button>
  </div>

  <!-- VISTA DOCUMENTO IMPRIMIBLE A4 -->
  <div id="vistaDocumento" style="display:none;">
    <div class="no-print" style="display: flex; gap: 10px; justify-content: space-between; align-items: center; max-width: 210mm; margin: 0 auto 16px auto; padding: 10px;">
      <button onclick="cerrarVistaDocumento()" class="btn btn-sm" style="background: #ffffff; color: #0f172a; border: 1px solid #cbd5e1;">⬅️ Volver</button>
      <div style="display: flex; gap: 8px;">
        <button onclick="window.print()" class="btn btn-sm" style="background:#0f172a; color:#ffffff;">🖨️ Imprimir</button>
        <button onclick="descargarPDF()" class="btn btn-accent btn-sm">📄 Descargar PDF</button>
      </div>
    </div>

    <div class="page-a4" id="documentoA4">
      <div id="watermarkElement" class="watermark-bg"></div>
      <div id="contenidoImprimible" class="doc-content"></div>
    </div>
  </div>

  <script>
    var SUPABASE_URL = 'https://fllcmidfhpgczjvnvuho.supabase.co';
    var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsbGNtaWRmaHBnY3pqdm52dWhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMDM0MDIsImV4cCI6MjEwNjc3OTQwMn0.pHENTLosOxgknz7tCMRtjBm9SYDJaLCbtwyrO1kkbkY'; 
    
    var _supabase = null;
    var _productosCache = [];
    var _configCache = { empresa: 'EL ANCLA', comercial: '', telefono: '', logo: '', es_marca_agua: true };
    var _clienteActual = '';

    window.addEventListener('load', function() {
      iniciarAplicacion();
    });

    function iniciarAplicacion() {
      try {
        if (window.supabase) {
          _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } else {
          mostrarError('No se pudo cargar la librería de Supabase.');
          return;
        }
        cargarProductos();
        cargarHistoricoListas();
        cargarConfiguracionSupabase();
      } catch (e) {
        mostrarError('Error al conectar: ' + e.message);
      }
    }

    function mostrarError(msj) {
      document.getElementById('listaProductosCard').innerHTML = '<div style="color:var(--danger); padding:12px; font-weight:600;">⚠️ ' + msj + '</div>';
      document.getElementById('listaSeleccionProductos').innerHTML = '<div style="color:var(--muted); padding:12px;">No disponible.</div>';
      document.getElementById('listaHistoricoCard').innerHTML = '<div style="color:var(--muted); padding:12px;">No disponible.</div>';
    }

    function switchTab(tabId) {
      cerrarVistaDocumento();
      var tabs = document.querySelectorAll('.tab-content');
      for (var i = 0; i < tabs.length; i++) {
        tabs[i].classList.remove('active');
      }
      var target = document.getElementById(tabId);
      if (target) target.classList.add('active');

      var tabNames = ['tabCatalogo', 'tabCrear', 'tabHistorial', 'tabAjustes'];
      var idx = tabNames.indexOf(tabId);
      var navItems = document.querySelectorAll('.nav-item');
      var webNavBtns = document.querySelectorAll('.web-nav-btn');
      
      for (var j = 0; j < navItems.length; j++) {
        navItems[j].classList.toggle('active', j === idx);
      }
      for (var k = 0; k < webNavBtns.length; k++) {
        webNavBtns[k].classList.toggle('active', k === idx);
      }
    }

    function procesarImagen(input, targetHiddenId) {
      if (input.files && input.files[0]) {
        var file = input.files[0];
        var reader = new FileReader();

        reader.onload = function(e) {
          var img = new Image();
          img.src = e.target.result;

          img.onload = function() {
            var canvas = document.createElement('canvas');
            var maxDimension = 400;
            var width = img.width;
            var height = img.height;

            if (width > height) {
              if (width > maxDimension) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              }
            } else {
              if (height > maxDimension) {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }

            canvas.width = width;
            canvas.height = height;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            var base64 = canvas.toDataURL('image/jpeg', 0.85);
            document.getElementById(targetHiddenId).value = base64;

            if (targetHiddenId === 'cfgLogoBase64') {
              document.getElementById('previewLogoContainer').innerHTML = '<img src="' + base64 + '" style="max-height:60px; border-radius:8px;">';
            }
          };
        };
        reader.readAsDataURL(file);
      }
    }

    async function cargarConfiguracionSupabase() {
      if (!_supabase) return;
      try {
        var res = await _supabase.from('configuracion').select('*').eq('id', 1).single();
        if (res.data) {
          _configCache = res.data;
          document.getElementById('cfgEmpresa').value = _configCache.empresa || 'EL ANCLA';
          document.getElementById('cfgComercial').value = _configCache.comercial || '';
          document.getElementById('cfgTelefono').value = _configCache.telefono || '';
          document.getElementById('cfgLogoBase64').value = _configCache.logo || '';
          document.getElementById('cfgMarcaAgua').checked = _configCache.es_marca_agua !== false;

          if (_configCache.logo) {
            document.getElementById('previewLogoContainer').innerHTML = '<img src="' + _configCache.logo + '" style="max-height:60px; border-radius:8px;">';
          }
        }
      } catch(e) {}
    }

    async function guardarConfiguracionSupabase() {
      var btn = document.getElementById('btnGuardarCfg');
      btn.disabled = true;
      btn.innerText = 'Guardando...';

      var payload = {
        id: 1,
        empresa: document.getElementById('cfgEmpresa').value.trim() || 'EL ANCLA',
        comercial: document.getElementById('cfgComercial').value.trim(),
        telefono: document.getElementById('cfgTelefono').value.trim(),
        logo: document.getElementById('cfgLogoBase64').value,
        es_marca_agua: document.getElementById('cfgMarcaAgua').checked
      };

      try {
        var res = await _supabase.from('configuracion').upsert([payload]);
        if (res.error) {
          alert('Error al guardar en Supabase: ' + res.error.message);
        } else {
          _configCache = payload;
          alert('¡Ajustes de empresa guardados correctamente!');
        }
      } catch(e) {
        alert('Error al guardar ajustes.');
      } finally {
        btn.disabled = false;
        btn.innerText = '💾 Guardar Ajustes en Supabase';
      }
    }

    async function cargarProductos() {
      var c1 = document.getElementById('listaProductosCard');
      var c2 = document.getElementById('listaSeleccionProductos');
      if (!_supabase) return;

      try {
        var res = await _supabase.from('productos').select('*').order('id', { ascending: false });
        var data = res.data;
        var error = res.error;

        if (error) {
          c1.innerHTML = '<div style="color:var(--danger); padding:12px; font-weight:600;">Error de la base de datos: ' + error.message + '</div>';
          return;
        }

        if (!data || data.length === 0) {
          _productosCache = [];
          c1.innerHTML = '<div style="color:var(--muted); text-align:center; padding:16px;">Sin productos registrados todavía.</div>';
          c2.innerHTML = '<div style="color:var(--muted); text-align:center; padding:16px;">No hay productos disponibles.</div>';
          return;
        }

        _productosCache = data;

        var htmlCard1 = '';
        var htmlCard2 = '';

        for (var i = 0; i < _productosCache.length; i++) {
          var p = _productosCache[i];
          var imgTag = p.url_foto ? '<img src="' + p.url_foto + '" class="product-img" alt="Foto">' : '<div class="product-img" style="display:flex;align-items:center;justify-content:center;font-size:20px;">📦</div>';
          var notaTag = p.notas ? '<div class="product-notes">📌 ' + p.notas + '</div>' : '';
          var precioFormatted = parseFloat(p.precio || 0).toFixed(2);

          htmlCard1 += '<div class="product-item">' +
            '<div class="product-left">' + imgTag +
              '<div>' +
                '<div class="product-name">' + (p.nombre || '') + '</div>' +
                notaTag +
                '<div class="product-price">' + precioFormatted + ' €</div>' +
              '</div>' +
            '</div>' +
            '<button class="btn btn-danger btn-sm" onclick="borrarProducto(' + p.id + ')">🗑️</button>' +
          '</div>';

          htmlCard2 += '<div class="product-item" style="gap:10px;">' +
            '<div class="product-left" style="flex:1;">' +
              '<input type="checkbox" class="prod-checkbox" value="' + p.id + '">' + imgTag +
              '<div>' +
                '<div class="product-name">' + (p.nombre || '') + '</div>' +
                notaTag +
              '</div>' +
            '</div>' +
            '<div style="display:flex; align-items:center; gap:4px;">' +
              '<input type="number" step="0.01" id="precio_edit_' + p.id + '" value="' + precioFormatted + '" style="width:80px; padding:6px 8px; text-align:right; font-weight:700;">' +
              '<span style="font-weight:700; font-size:14px; color:var(--muted);">€</span>' +
            '</div>' +
          '</div>';
        }

        c1.innerHTML = htmlCard1;
        c2.innerHTML = htmlCard2;

      } catch(e) {
        c1.innerHTML = '<div style="color:var(--danger); padding:12px;">Error al cargar: ' + e.message + '</div>';
      }
    }

    async function guardarProducto() {
      var nombre = document.getElementById('prodNombre').value.trim();
      var precio = parseFloat(document.getElementById('prodPrecio').value);
      var notas = document.getElementById('prodNotas').value.trim();
      var url_foto = document.getElementById('prodFotoBase64').value;

      var btn = document.getElementById('btnGuardarProd');

      if (!nombre || isNaN(precio)) {
        alert('Escribe al menos el nombre y el precio.');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Guardando...';

      try {
        var res = await _supabase.from('productos').insert([{ nombre: nombre, precio: precio, notas: notas, url_foto: url_foto }]);
        if (res.error) {
          alert('Error al guardar en Supabase: ' + res.error.message);
        } else {
          document.getElementById('prodNombre').value = '';
          document.getElementById('prodPrecio').value = '';
          document.getElementById('prodNotas').value = '';
          document.getElementById('prodArchivoFoto').value = '';
          document.getElementById('prodFotoBase64').value = '';
          await cargarProductos();
        }
      } catch (e) {
        alert('Error inesperado al guardar.');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Guardar Producto';
      }
    }

    async function borrarProducto(id) {
      if (!confirm('¿Eliminar producto?')) return;
      await _supabase.from('productos').delete().eq('id', id);
      cargarProductos();
    }

    async function generarLista() {
      var cliente = document.getElementById('clienteNombre').value.trim();
      if (!cliente) {
        alert('Escribe el nombre del cliente.');
        return;
      }

      var cbs = document.querySelectorAll('.prod-checkbox:checked');
      if (cbs.length === 0) {
        alert('Selecciona al menos un producto.');
        return;
      }

      var itemsPersonalizados = [];
      for (var i = 0; i < cbs.length; i++) {
        var prodId = parseInt(cbs[i].value);
        var inputPrecio = document.getElementById('precio_edit_' + prodId);
        var precioCustom = inputPrecio ? parseFloat(inputPrecio.value) : 0;

        itemsPersonalizados.push({
          id: prodId,
          precio: isNaN(precioCustom) ? 0 : precioCustom
        });
      }

      var res = await _supabase.from('listas_generadas').insert([{ 
        cliente_nombre: cliente, 
        productos_ids: itemsPersonalizados 
      }]).select();
      
      if (res.error) {
        alert('Error al generar la lista: ' + res.error.message);
        return;
      }

      document.getElementById('clienteNombre').value = '';
      await cargarHistoricoListas();
      
      if (res.data && res.data[0]) {
        verListaDocumento(res.data[0].id);
      }
    }

    async function cargarHistoricoListas() {
      var container = document.getElementById('listaHistoricoCard');
      if (!_supabase) return;

      try {
        var res = await _supabase.from('listas_generadas').select('*').order('id', { ascending: false });
        var data = res.data;

        if (!data || data.length === 0) {
          container.innerHTML = '<div style="color:var(--muted); text-align:center; padding:12px;">Sin historial de listas.</div>';
          return;
        }

        var htmlHistorico = '';
        for (var i = 0; i < data.length; i++) {
          var l = data[i];
          htmlHistorico += '<div class="product-item">' +
            '<div>' +
              '<div class="product-name">' + l.cliente_nombre + '</div>' +
              '<div style="font-size: 12px; color: var(--muted);">' + new Date(l.fecha).toLocaleDateString('es-ES') + '</div>' +
            '</div>' +
            '<div style="display:flex; gap:6px;">' +
              '<button class="btn btn-accent btn-sm" onclick="verListaDocumento(' + l.id + ')">👁️ Ver</button>' +
              '<button class="btn btn-danger btn-sm" onclick="borrarLista(' + l.id + ')">🗑️</button>' +
            '</div>' +
          '</div>';
        }
        container.innerHTML = htmlHistorico;
      } catch(e) {}
    }

    async function verListaDocumento(id) {
      var res = await _supabase.from('listas_generadas').select('*').eq('id', id).single();
      var lista = res.data;
      if (!lista) return;

      _clienteActual = lista.cliente_nombre;
      var cfg = _configCache;

      // Marca de Agua
      var watermarkEl = document.getElementById('watermarkElement');
      if (cfg.logo) {
        watermarkEl.innerHTML = '<img src="' + cfg.logo + '" style="width:100%;">';
      } else {
        watermarkEl.innerHTML = '';
      }

      var comercialNombre = cfg.comercial ? cfg.comercial.toUpperCase() : 'KIKE';
      var telefonoNum = cfg.telefono || '660875927';

      // Obtener productos
      var rawItems = lista.productos_ids || [];
      var productosSeleccionados = [];

      for (var i = 0; i < rawItems.length; i++) {
        var item = rawItems[i];
        var itemObj = (typeof item === 'object') ? item : { id: item, precio: null };
        
        var prodEncontrado = _productosCache.find(function(p) { return p.id === itemObj.id; });
        if (prodEncontrado) {
          var pClone = JSON.parse(JSON.stringify(prodEncontrado));
          if (itemObj.precio !== null && itemObj.precio !== undefined) {
            pClone.precio = itemObj.precio;
          }
          productosSeleccionados.push(pClone);
        }
      }

      // Filas con fotos grandes (75px x 65px)
      var rowsHtml = '';
      for (var j = 0; j < productosSeleccionados.length; j++) {
        var p = productosSeleccionados[j];
        var imgTag = p.url_foto 
          ? '<img src="' + p.url_foto + '" style="width:75px; height:65px; border-radius:8px; object-fit:cover; margin-right:16px; vertical-align:middle; border:1px solid #cbd5e1;">' 
          : '<div style="width:75px; height:65px; border-radius:8px; background:#f1f5f9; display:inline-flex; align-items:center; justify-content:center; font-size:24px; margin-right:16px; vertical-align:middle;">📦</div>';
        
        var notaTag = p.notas ? '<div style="font-size: 12px; color: #64748b; margin-top: 3px;">' + p.notas + '</div>' : '';

        rowsHtml += '<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 6px; border-bottom: 1px solid #e2e8f0;">' +
          '<div style="display: flex; align-items: center;">' +
            imgTag +
            '<div>' +
              '<div style="font-size: 16px; font-weight: 500; color: #111827;">' + (p.nombre || '') + '</div>' +
              notaTag +
            '</div>' +
          '</div>' +
          '<div style="font-size: 17px; font-weight: 700; color: #0d233a; text-align: right; min-width: 90px;">' +
            parseFloat(p.precio || 0).toFixed(2) + ' €' +
          '</div>' +
        '</div>';
      }

      // Estructura con TONOS DE COLOR AJUSTADOS AL PDF EXACTO:
      var htmlDoc = '' +
        '<div style="margin-bottom: 20px;">' +
          // EL ANCLA (Azul Oscuro)
          '<h1 style="margin: 0; text-align: center; font-family: \'Oswald\', var(--font-main); font-size: 36px; color: #0d233a; letter-spacing: 1.5px; text-transform: uppercase;">' +
            (cfg.empresa || 'EL ANCLA') +
          '</h1>' +
          
          // COMERCIAL: KIKE (Azul claro/medio) | TELÉFONO (Azul oscuro)
          '<div style="text-align: center; font-size: 15px; font-weight: 700; margin-top: 6px; letter-spacing: 0.5px; text-transform: uppercase;">' +
            '<span style="color: #0056b3;">COMERCIAL: ' + comercialNombre + '</span> ' +
            '<span style="color: #0d233a;">| ' + telefonoNum + '</span>' +
          '</div>' +

          // CLIENTE: Nombre (Azul claro) y Fecha (Gris) a la derecha
          '<div style="margin-top: 20px; text-align: right; font-size: 14px;">' +
            '<div style="font-weight: 700; text-transform: uppercase; margin-bottom: 2px; color: #0056b3;">' +
              'CLIENTE: ' + (lista.cliente_nombre || '') +
            '</div>' +
            '<div style="color: #6c757d; font-weight: 500;">' +
              'Fecha: ' + new Date(lista.fecha).toLocaleDateString('es-ES') +
            '</div>' +
          '</div>' +
        '</div>' +

        // Raya Superior Oscura
        '<div style="border-top: 2px solid #0d233a; margin-bottom: 12px;"></div>' +

        // Encabezados FOTO PRODUCTO / PRECIO (Azul Marino Oscuro)
        '<div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; color: #0d233a; text-transform: uppercase; letter-spacing: 0.5px; padding: 0 6px 8px 6px;">' +
          '<div>FOTO PRODUCTO</div>' +
          '<div>PRECIO</div>' +
        '</div>' +

        // Raya Azul inferior del encabezado
        '<div style="border-bottom: 3px solid #0056b3; margin-bottom: 10px;"></div>' +

        // Listado de Productos
        '<div>' + rowsHtml + '</div>';

      document.getElementById('contenidoImprimible').innerHTML = htmlDoc;
      var noPrintEls = document.querySelectorAll('.no-print');
      for (var k = 0; k < noPrintEls.length; k++) {
        noPrintEls[k].style.display = 'none';
      }
      document.getElementById('vistaDocumento').style.display = 'block';
      window.scrollTo(0, 0);
    }

    function descargarPDF() {
      var elemento = document.getElementById('documentoA4');
      var opciones = {
        margin: 0,
        filename: 'Lista_Precios_El_Ancla_' + (_clienteActual || 'Cliente') + '.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };
      html2pdf().set(opciones).from(elemento).save();
    }

    function cerrarVistaDocumento() {
      document.getElementById('vistaDocumento').style.display = 'none';
      var noPrintEls = document.querySelectorAll('.no-print');
      for (var i = 0; i < noPrintEls.length; i++) {
        noPrintEls[i].style.display = '';
      }
    }

    async function borrarLista(id) {
      if (!confirm('¿Borrar lista del historial?')) return;
      await _supabase.from('listas_generadas').delete().eq('id', id);
      cargarHistoricoListas();
    }
  </script>
</body>
</html>
