<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>El Ancla | Catálogo Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --primary: #0f172a;
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --radius: 16px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      padding-bottom: 90px;
    }

    .container { max-width: 100%; margin: 0 auto; padding: 16px; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand-title {
      font-family: 'Oswald', sans-serif;
      font-size: 24px;
      color: var(--primary);
      margin: 0;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .web-nav { display: none; gap: 10px; }
    .web-nav-btn {
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }
    .web-nav-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    .card-header {
      font-family: 'Oswald', sans-serif;
      font-size: 18px;
      color: var(--primary);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .grid-layout { display: flex; flex-direction: column; gap: 16px; }

    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    input[type="text"], input[type="number"], input[type="file"] {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--primary);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }
    .btn-accent { background: var(--accent); }
    .btn-danger { background: #fef2f2; color: var(--danger); }
    .btn-sm { width: auto; padding: 8px 14px; font-size: 13px; }

    .product-grid { display: flex; flex-direction: column; gap: 10px; }

    .product-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .product-left { display: flex; align-items: center; gap: 12px; }
    .product-img { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; background: #e2e8f0; }
    .product-name { font-weight: 600; font-size: 15px; }
    .product-notes { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .product-price { font-size: 14px; font-weight: 700; color: var(--accent); }

    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 100;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      border: none;
      background: none;
      width: 33.33%;
    }
    .nav-item.active { color: var(--accent); }

    .tab-content { display: none !important; }
    .tab-content.active { display: block !important; }

    .page-a4 {
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      background: #ffffff;
      padding: 20mm 15mm;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      border-radius: 4px;
      box-sizing: border-box;
    }

      body { padding-bottom: 30px; }
      .container { max-width: 1280px; padding: 24px; }

      .nav-bar { display: none !important; }
