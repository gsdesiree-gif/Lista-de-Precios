<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>El Ancla | Catálogo Pro</title>
  <!-- FUENTES DE DISEÑO PREMIUM -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --primary: #0f172a;
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --radius: 18px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      padding-bottom: 90px;
    }

    /* CONTENEDOR DINÁMICO (MÓVIL / WEB) */
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
      transition: max-width 0.3s ease;
    }

    body.mode-web .container {
      max-width: 1100px;
    }

    /* TOP BAR */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand-title {
      font-family: 'Oswald', sans-serif;
      font-size: 22px;
      color: var(--primary);
      margin: 0;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* NAVEGACIÓN DESKTOP / WEB (Oculta en modo móvil) */
    .web-nav {
      display: none;
      gap: 8px;
    }
    body.mode-web .web-nav {
      display: flex;
    }
    .web-nav-btn {
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }
    .web-nav-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    /* TARJETAS MODERNAS */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.04);
    }

    .card-header {
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      color: var(--primary);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* DISPOSICIÓN EN GRILLA PARA MODO WEB */
    body.mode-web .grid-web-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* INPUTS & CAMPOS */
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="text"], input[type="number"], input[type="file"] {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--primary);
      transition: all 0.2s;
    }
    input[type="text"]:focus, input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    /* BOTONES */
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-accent { background: var(--accent); }
    .btn-danger { background: #fef2f2; color: var(--danger); }
    .btn-sm { width: auto; padding: 8px 12px; font-size: 13px; }

    /* SWITCH ACCESIBLE */
    .switch-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-top: 1px solid var(--border);
      margin-top: 10px;
    }
    .switch-title { font-size: 14px; font-weight: 500; }
    .switch-group input { width: 20px; height: 20px; accent-color: var(--accent); }

    /* TARJETAS TÁCTILES DE PRODUCTO */
    .product-grid { display: flex; flex-direction: column; gap: 10px; }
    body.mode-web .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }

    .product-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 14px;
      transition: background 0.2s;
      cursor: pointer;
    }
    .product-item.selected {
      background: var(--accent-light);
      border-color: var(--accent);
    }
    .product-left { display: flex; align-items: center; gap: 12px; }
    .product-img { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; background: #cbd5e1; }
    .product-name { font-weight: 600; font-size: 15px; }
    .product-price { font-size: 14px; font-weight: 700; color: var(--accent); }

    /* NAVEGACIÓN MÓVIL INFERIOR */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 100;
    }
    body.mode-web .nav-bar {
      display: none;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border: none;
      background: none;
      width: 25%;
    }
    .nav-item.active { color: var(--accent); }
    .nav-icon { font-size: 20px; }

    /* PESTAÑAS OCULTAS */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* MARCA DE AGUA IMPRESIÓN */
    .watermark-container { position: relative; overflow: hidden; }
    .watermark-bg {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 50%; opacity: 0.08;
      pointer-events: none; z-index: 1;
    }

    @media print {
      body { background: white; padding: 0; }
      .no-print, .nav-bar, .top-bar { display: none !important; }
      .card { border: none; box-shadow: none; padding: 0; }
      table { width: 100%; border-collapse: collapse; }
      th, td { border-bottom: 1px solid #e2e8f0; padding: 10px; }
      th { background-color: #f8fafc !important; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <div class="top-bar no-print">
    <div class="brand-title">EL ANCLA</div>

    <!-- NAVEGACIÓN MODO WEB -->
    <div class="web-nav">
      <button class="web-nav-btn active" onclick="switchTab('tabCatalogo', this)">📦 Productos</button>
      <button class="web-nav-btn" onclick="switchTab('tabCrear', this)">📝 Crear Lista</button>
      <button class="web-nav-btn" onclick="switchTab('tabHistorial', this)">📜 Histórico</button>
    </div>

    <div style="display: flex; gap: 8px;">
      <!-- BOTÓN CONMUTADOR MÓVIL / WEB -->
      <button id="btnToggleMode" onclick="toggleLayoutMode()" class="btn btn-sm" style="background: #f1f5f9; color: var(--primary);">💻 Vista Web</button>
      <button onclick="toggleConfig()" class="btn btn-sm" style="background: var(--accent-light); color: var(--accent);">⚙️ Ajustes</button>
    </div>
  </div>

  <div class="container no-print">

    <!-- MODAL DE CONFIGURACIÓN / EMPRESA -->
    <div id="tabConfig" class="card" style="display: none;">
      <div class="card-header">⚙️ Ajustes del Encabezado</div>
      <div class="field">
        <label>Empresa</label>
        <input type="text" id="empresaNombre" placeholder="Ej: El Ancla">
      </div>
      <div class="field">
        <label>Comercial</label>
        <input type="text" id="comercialNombre" placeholder="Ej: Juan Pérez">
      </div>
      <div class="field">
        <label>Teléfono Comercial</label>
        <input type="text" id="comercialTelefono" placeholder="Ej: +34 600 000 000">
      </div>
      <div class="field">
        <label>Logo de Empresa</label>
        <input type="file" id="empresaLogoFile" accept="image/*" onchange="subirLogoProcesado()">
        <input type="hidden" id="empresaLogoUrl">
        <img id="logoPreviewImg" style="max-height: 45px; margin-top: 8px; border-radius: 8px; display: none;">
        <button id="btnEliminarLogo" onclick="eliminarLogo()" class="btn btn-danger btn-sm" style="display: none; margin-top: 8px;">🗑️ Quitar Logo</button>
      </div>

      <div class="switch-group">
        <span class="switch-title">Mostrar marca de agua al imprimir</span>
        <input type="checkbox" id="usarMarcaAgua" checked>
      </div>

      <button onclick="guardarEncabezadoNube(); toggleConfig();" class="btn btn-accent" style="margin-top: 12px;">💾 Guardar Ajustes</button>
    </div>

    <!-- PESTAÑA 1: CATÁLOGO Y PRODUCTOS -->
    <div id="tabCatalogo" class="tab-content active">
      <div class="grid-web-2">
        <div class="card">
          <div class="card-header">➕ Registrar Producto</div>
          <div class="field">
            <label>Nombre</label>
            <input type="text" id="prodNombre" placeholder="Ej: Menú Pollo Guisado">
          </div>
          <div class="field">
            <label>Precio (€)</label>
            <input type="number" step="0.01" id="prodPrecio" placeholder="6.50">
          </div>
          <div class="field">
            <label>Foto</label>
            <input type="file" id="prodFoto" accept="image/*">
          </div>
          <button onclick="guardarProducto()" class="btn">Guardar Producto</button>
        </div>

        <div class="card">
          <div class="card-header">📦 Productos Registrados</div>
          <div id="listaProductosCard" class="product-grid">
            <!-- Render dinámico -->
          </div>
        </div>
      </div>
    </div>

    <!-- PESTAÑA 2: CREAR LISTA DE PRECIOS -->
    <div id="tabCrear" class="tab-content">
      <div class="card">
        <div class="card-header">🚀 Nueva Lista de Precios</div>
        <div class="field">
          <label>Nombre del Cliente</label>
          <input type="text" id="clienteNombre" placeholder="Ej: Restaurante El Faro">
        </div>

        <div style="font-size: 13px; font-weight: 600; color: var(--muted); margin: 16px 0 8px 0;">SELECCIONA LOS PRODUCTOS:</div>
        <div id="listaSeleccionProductos" class="product-grid">
          <!-- Render dinámico -->
        </div>

        <button onclick="generarLista()" class="btn btn-accent" style="margin-top: 20px;">💾 Generar Lista de Precios</button>
      </div>
    </div>

    <!-- PESTAÑA 3: HISTORIAL -->
    <div id="tabHistorial" class="tab-content">
      <div class="card">
        <div class="card-header">📜 Listas Guardadas</div>
        <div id="listaHistoricoCard" class="product-grid">
          <!-- Render dinámico -->
        </div>
      </div>
    </div>

  </div>

  <!-- NAVEGACIÓN INFERIOR ESTILO APP (SOLO VISIBLE EN MODO MÓVIL) -->
  <div class="nav-bar no-print">
    <button class="nav-item active" onclick="switchTab('tabCatalogo', this)">
      <span class="nav-icon">📦</span>
      <span>Productos</span>
    </button>
    <button class="nav-item" onclick="switchTab('tabCrear', this)">
      <span class="nav-icon">📝</span>
      <span>Crear Lista</span>
    </button>
    <button class="nav-item" onclick="switchTab('tabHistorial', this)">
      <span class="nav-icon">📜</span>
      <span>Histórico</span>
    </button>
    <button class="nav-item" onclick="toggleLayoutMode()">
      <span class="nav-icon">💻</span>
      <span>Vista Web</span>
    </button>
  </div>

  <!-- VISTA DOCUMENTO IMPRIMIBLE / PDF -->
  <div id="vistaDocumento" style="display:none;" class="card watermark-container container">
    <button onclick="cerrarVistaDocumento()" class="no-print btn" style="background:#64748b; margin-bottom:12px;">⬅️ Volver</button>
    <button onclick="window.print()" class="no-print btn btn-accent" style="margin-bottom:16px;">📥 Imprimir / Guardar PDF</button>

    <div id="contenidoImprimible" style="position: relative; z-index: 2;"></div>
  </div>

  <script>

    let _supabase = null;

    window.onload = function() {
      try {
        _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        cargarEncabezadoNube();
        cargarProductos();
        cargarHistoricoListas();
      } catch (e) {
        console.error("Error cargando Supabase:", e);
      }
    };

    function toggleLayoutMode() {
      const isWeb = document.body.classList.toggle('mode-web');
      const btn = document.getElementById('btnToggleMode');
      btn.innerHTML = isWeb ? '📱 Vista Móvil' : '💻 Vista Web';
    }

    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.querySelectorAll('.web-nav-btn').forEach(n => n.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');

      // Marcar activo en ambas barras
      const tabIndex = ['tabCatalogo', 'tabCrear', 'tabHistorial'].indexOf(tabId);
      if (tabIndex !== -1) {
        const navItems = document.querySelectorAll('.nav-item');
        if (navItems[tabIndex]) navItems[tabIndex].classList.add('active');

        const webBtns = document.querySelectorAll('.web-nav-btn');
        if (webBtns[tabIndex]) webBtns[tabIndex].classList.add('active');
      }
    }

    function toggleConfig() {
      const cfg = document.getElementById('tabConfig');
      cfg.style.display = cfg.style.display === 'none' ? 'block' : 'none';
    }

    async function eliminarLogo() {
      document.getElementById('empresaLogoUrl').value = '';
      document.getElementById('empresaLogoFile').value = '';
      document.getElementById('logoPreviewImg').style.display = 'none';
      document.getElementById('btnEliminarLogo').style.display = 'none';
      await guardarEncabezadoNube();
    }

    async function guardarEncabezadoNube() {
      if (!_supabase) return;
      const empresa = document.getElementById('empresaNombre').value;
      const comercial = document.getElementById('comercialNombre').value;
      const telefono = document.getElementById('comercialTelefono').value;
      const logoUrl = document.getElementById('empresaLogoUrl').value;

      const { error } = await _supabase.from('configuracion').upsert([
        { id: 'fija', empresa, comercial, telefono, logo_url: logoUrl }
      ]);

      if (error) alert('Error: ' + error.message);
      else alert('¡Ajustes guardados correctamente!');
    }

    async function cargarEncabezadoNube() {
      if (!_supabase) return;
      try {
        const { data } = await _supabase.from('configuracion').select('*').eq('id', 'fija').maybeSingle();
        if (data) {
          document.getElementById('empresaNombre').value = data.empresa || '';
          document.getElementById('comercialNombre').value = data.comercial || '';
          document.getElementById('comercialTelefono').value = data.telefono || '';
          document.getElementById('empresaLogoUrl').value = data.logo_url || '';

          if (data.logo_url) {
            const preview = document.getElementById('logoPreviewImg');
            preview.src = data.logo_url;
            preview.style.display = 'block';
            document.getElementById('btnEliminarLogo').style.display = 'inline-block';
          }
        }
      } catch(e) {}
    }
