<!-- Cargar la librería de Supabase desde CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // Tu configuración de Supabase
  const SUPABASE_URL = 'https://TU-PROYECTO.supabase.co';
  const SUPABASE_KEY = 'TU_ANON_KEY';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Función para guardar el producto desde la web
  async function agregarProducto() {
    const nombre = document.getElementById('nombreProducto').value;
    const precio = parseFloat(document.getElementById('precioProducto').value);
    const archivoFoto = document.getElementById('fotoProducto').files[0];

    let urlFoto = '';

    // Subir la foto al bucket
    if (archivoFoto) {
      const nombreArchivo = `${Date.now()}_${archivoFoto.name}`;
      const { data: storageData, error: storageError } = await _supabase
        .storage
        .from('productos-fotos')
        .upload(nombreArchivo, archivoFoto);

      if (storageError) {
        alert('Error al subir la imagen: ' + storageError.message);
        return;
      }

      // Obtener la URL pública para la foto
      const { data: publicUrlData } = _supabase
        .storage
        .from('productos-fotos')
        .getPublicUrl(nombreArchivo);

      urlFoto = publicUrlData.publicUrl;
    }

    // Insertar producto en la tabla de Supabase
    const { data, error } = await _supabase
      .from('productos')
      .insert([
        { nombre: nombre, precio: precio, url_foto: urlFoto }
      ]);

    if (error) {
      alert('Error guardando el producto: ' + error.message);
    } else {
      alert('¡Producto guardado exitosamente!');
    }
  }
</script>
